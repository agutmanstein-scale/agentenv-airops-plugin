<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirOpsEnv v1 · Boston Logan</title>
<style>
  html, body { margin: 0; height: 100%; background: #20242a; overflow: hidden; }
  body { font: 13px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #eef3f6; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  .ao-card { position: fixed; left: 18px; top: 16px; z-index: 10; padding: 11px 16px 12px; border-radius: 9px;

  .ao-card h1 { margin: 0 0 4px; font-size: 15.5px; font-weight: 650; letter-spacing: 0.005em; }
  .ao-card h1 span { font-weight: 450; color: #c3d3db; }
  .ao-card .when { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .ao-card .when small { font-size: 12px; font-weight: 500; color: #a9bcc6; margin-left: 8px; }
  .ao-card .wx { color: #d6e2e8; margin-top: 2px; }
  .ao-attr { position: fixed; right: 14px; bottom: 12px; z-index: 10; padding: 4px 10px; border-radius: 6px; font-size: 11.5px;
    color: #e6edf1; background: rgba(18, 30, 42, 0.7); }
  body.record .ao-tag { transition: none !important; }
  body.bare .ao-card, body.bare .ao-attr { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<div id="stage"></div>
<div class="ao-card">
  <h1>AirOpsEnv v1 · GPT-6.1 Sol <span>· Boston Logan, Sun 16 Feb 2025</span></h1>
  <div class="when" id="ao-when"></div>
  <div class="wx" id="ao-wx"></div>
</div>
<div class="ao-attr" id="ao-attr"></div>
<script type="module" src="./stage.js"></script>
</body>
</html>
