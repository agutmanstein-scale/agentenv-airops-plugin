<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AirOpsEnv · aircraft</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 12px/1.4 Inter, system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; color: #e9eef4; background: rgba(12, 18, 26, 0.6); padding: 5px 10px; border-radius: 999px; }
  .cell { position: fixed; color: #fff; background: rgba(12, 18, 26, 0.62); padding: 2px 9px; border-radius: 999px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="hud"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { aircraftLook, buildAircraft } from "./aircraft.js";

const Q = new URLSearchParams(location.search);
const cam = Q.get("cam") || "front34";
const night = Q.get("night") === "1";
const focus = +(Q.get("i") || 0);
const lightsOn = new Set((Q.get("lights") ?? "nav,beacon").split(",").filter(Boolean));
const FLEET = [
  { class: "a320", length: 37.6, span: 35.8, jetblue: true, label: "A320 · JetBlue" },
  { class: "a321", length: 44.5, span: 35.8, jetblue: true, label: "A321 · JetBlue" },
  { class: "a220", length: 38.7, span: 35.1, jetblue: true, label: "A220-300 · JetBlue" },
  { class: "e190", length: 36.2, span: 28.7, jetblue: true, label: "E190 · JetBlue" },
  { class: "a320", length: 37.6, span: 35.8, jetblue: false, label: "A320" },
  { class: "narrowbody", length: 39.5, span: 35.8, jetblue: false, label: "narrowbody (737-800)" },
  { class: "regional", length: 31.7, span: 26.0, jetblue: false, label: "regional (E175)" },
  { class: "regional_t", length: 36.2, span: 24.9, jetblue: false, label: "regional_t (CRJ900)" },
  { class: "widebody", length: 62.8, span: 60.1, jetblue: false, label: "widebody (787-9)" },
].filter((f) => !Q.get("only") || Q.get("only").split(",").includes(f.class));
const fleetN = +(Q.get("fleet") || 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +(Q.get("exp") || (night ? 1.3 : 1.0));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = night
  ? { zenith: "#06090f", horizon: "#1d212b", glow: "#241f22", fog: "#1a1d24" }
  : { zenith: "#36404f", horizon: "#8b8d93", glow: "#b8907a", fog: "#7c8189" };

function skyDome(radius) {
  return new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uZ: { value: new THREE.Color(SKY.zenith) }, uH: { value: new THREE.Color(SKY.horizon) }, uG: { value: new THREE.Color(SKY.glow) } },
    vertexShader: "varying vec3 vD; void main(){ vD = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }",
    fragmentShader: `uniform vec3 uZ, uH, uG; varying vec3 vD;
      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float n2(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f); return mix(mix(h2(i), h2(i+vec2(1,0)), u.x), mix(h2(i+vec2(0,1)), h2(i+vec2(1,1)), u.x), u.y); }
      void main(){ vec3 d = normalize(vD); float h = max(d.y, 0.0);
        vec3 c = mix(uH, uZ, smoothstep(0.0, 0.6, h));
        vec2 w = normalize(vec2(-0.94, 0.34)); float g = pow(max(dot(normalize(d.xz + 1e-5), w), 0.0), 3.0) * (1.0 - smoothstep(0.0, 0.3, h));
        c = mix(c, uG, g * 0.55);
        vec2 cp = d.xz / (h + 0.08) * 2.0; float cl = n2(cp) * 0.5 + n2(cp * 2.3) * 0.3 + n2(cp * 5.1) * 0.2;
        c *= 0.93 + 0.12 * cl * smoothstep(0.0, 0.1, h);
        if (d.y < 0.0) c = mix(uH, uH * 0.45, smoothstep(0.0, 0.1, -d.y));
        gl_FragColor = vec4(c, 1.0);
        #include <colorspace_fragment>
      }`,
  }));
}
scene.add(skyDome(9000));
const pm = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(skyDome(100));
const envGround = new THREE.Mesh(new THREE.CircleGeometry(90, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: night ? "#121316" : "#3d3f42" }));
envGround.position.y = -3;
envScene.add(envGround);
scene.environment = pm.fromScene(envScene, 0.04).texture;
scene.environmentIntensity = night ? 0.25 : 0.9;
scene.fog = new THREE.FogExp2(SKY.fog, +(Q.get("fog") || 0.0011));

const sun = new THREE.DirectionalLight(night ? "#6c7a96" : "#e8c9ad", +(Q.get("sun") ?? (night ? 0.08 : 0)));
sun.position.set(-300, 70, 110);
sun.castShadow = sun.intensity > 0;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -260, right: 260, top: 160, bottom: -160, near: 10, far: 900 });
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: `#${Q.get("ground") || (night ? "5a5c5f" : "8e9194")}`, roughness: 0.42, metalness: 0.0 }));
ground.receiveShadow = true;
scene.add(ground);

const paint = new THREE.MeshStandardMaterial({ color: "#d9b13b", roughness: 0.6 });
const white = new THREE.MeshStandardMaterial({ color: "#d8dadb", roughness: 0.6 });
const planes = [];
let x = 0;
if (fleetN) {
  for (let i = 0; i < fleetN; i++) {
    const spec = FLEET[(i * 7) % FLEET.length];
    const a = buildAircraft(spec);
    a.object.position.set((i % 15) * 72, 0, Math.floor(i / 15) * 85);
    a.object.rotation.y = (i % 4) * 0.4;
    scene.add(a.object);
    planes.push({ ...a, spec, x: a.object.position.x, d: a.object.userData.dims });
  }
  x = 14 * 72;
}
if (!fleetN) FLEET.forEach((spec, i) => {
  if (i) x += FLEET[i - 1].span / 2 + 9 + spec.span / 2;
  const a = buildAircraft(spec);
  const d = a.object.userData.dims;
  a.object.position.set(x, 0, d.nose);
  scene.add(a.object);
  planes.push({ ...a, spec, x, d });
  const lead = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 90).rotateX(-Math.PI / 2), paint);
  lead.position.set(x, 0.02, 40);
  const stop = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.25).rotateX(-Math.PI / 2), paint);
  stop.position.set(x, 0.02, d.nose);
  scene.add(lead, stop);
  const box = new THREE.Mesh(new THREE.PlaneGeometry(spec.span + 6, 0.2).rotateX(-Math.PI / 2), white);
  box.position.set(x, 0.02, -2);
  scene.add(box);
});
const rowMid = x / 2;

for (let k = -1; k <= Math.ceil(x / 70) + 1; k++) {
  const fx = k * 70;
  const s = new THREE.SpotLight(night ? "#ffd9a6" : "#ffe6c8", night ? 9000 : 5000, 260, 0.75, 0.6, 2);
  s.position.set(fx, 28, -55);
  s.target.position.set(fx, 0, 25);
  scene.add(s, s.target);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 28, 8), white);
  mast.position.set(fx, 14, -57);
  scene.add(mast);
}
const term = new THREE.Mesh(new THREE.BoxGeometry(x + 300, 16, 30), new THREE.MeshStandardMaterial({ color: "#7d8288", roughness: 0.7 }));
term.position.set(rowMid, 8, -78);
scene.add(term);
aircraftLook.cabin.value = night ? 1 : +(Q.get("cabin") || 0.12);
aircraftLook.wet.value = +(Q.get("wet") || 0.6);

const camera = new THREE.PerspectiveCamera(+(Q.get("fov") || 35), innerWidth / innerHeight, 0.3, 20000);
const P = planes[Math.min(focus, planes.length - 1)];
const at = (p, dx, dy, dz) => new THREE.Vector3(p.x + dx, dy, p.d.nose + dz);
const VIEWS = {
  front34: () => [at(P, -34, 6.5, -38), at(P, 3, 3.2, 14)],
  gate: () => [at(P, 7, 13, -34), at(P, 0, 3, 14)],
  nose: () => [at(P, -8, 4.8, -13), at(P, 0, 3.4, -1)],
  noseside: () => [at(P, 13, P.d.ng + 2.6, -P.d.nose + 3.2), at(P, 0, P.d.ng + 2.2, -P.d.nose + 3.2)],
  nosefront: () => [at(P, 0, P.d.ng + 3.4, -P.d.nose - 12), at(P, 0, P.d.ng + 2.6, -P.d.nose + 3)],
  rear34: () => [at(P, 40, 9, P.d.length + 30), at(P, 0, 3.5, P.d.length * 0.45)],
  tower: () => fleetN ? [new THREE.Vector3(rowMid, 70, 1050), new THREE.Vector3(rowMid, 0, 380)] : [new THREE.Vector3(rowMid - 240, 62, 560), new THREE.Vector3(rowMid, 2, 15)],
  top: () => [new THREE.Vector3(rowMid, 900, 30.01), new THREE.Vector3(rowMid, 0, 30)],
  topi: () => [at(P, 0, 160, P.d.length / 2 + 0.01), at(P, 0, 0, P.d.length / 2)],
  under: () => [at(P, -18, 1.2, -16), at(P, 0, 2.5, 10)],
};
const view = (VIEWS[cam] || VIEWS.front34)();
camera.position.copy(view[0]);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(view[1]);
controls.update();
if (cam === "top") camera.fov = 26;
if (cam === "tower") camera.fov = +(Q.get("fov") || 22);
camera.updateProjectionMatrix();

function setLights(t) {
  const st = Object.fromEntries(["nav", "beacon", "strobe", "landing", "taxi"].map((k) => [k, lightsOn.has(k)]));
  for (const p of planes) p.setLights({ ...st, time: t });
}

const hud = document.getElementById("hud");
const tris = Object.fromEntries(planes.map((p) => [p.spec.label, p.object.userData.tris]));
hud.textContent = `${cam} · ${planes.map((p) => `${p.spec.label} ${p.object.userData.tris}`).join(" · ")}`;
if (Q.get("hud") === "0" || fleetN) hud.style.display = "none";

function sideGrid() {
  const cols = Math.ceil(Math.sqrt(planes.length)), rows = Math.ceil(planes.length / cols);
  const W = innerWidth, H = innerHeight, cw = W / cols, ch = H / rows;
  renderer.setScissorTest(true);
  const c = new THREE.PerspectiveCamera(16, cw / ch, 1, 5000);
  planes.forEach((p, i) => {
    for (const q of planes) q.object.visible = q === p;
    const col = i % cols, row = Math.floor(i / cols);
    const L = Math.max(p.d.length, p.d.span * 0.6);
    const dist = (L * 0.54) / Math.tan(THREE.MathUtils.degToRad(c.fov) / 2) / c.aspect;
    const zc = p.d.length / 2;
    c.position.set(p.x + dist, 3.2 + p.d.height * 0.1, zc + 0.01);
    c.lookAt(p.x, p.d.height * 0.33, zc);
    renderer.setViewport(col * cw, H - (row + 1) * ch, cw, ch);
    renderer.setScissor(col * cw, H - (row + 1) * ch, cw, ch);
    renderer.render(scene, c);
  });
  renderer.setScissorTest(false);
  for (const q of planes) q.object.visible = true;
}
if (cam === "side") {
  const cols = Math.ceil(Math.sqrt(planes.length)), rows = Math.ceil(planes.length / cols);
  planes.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "cell";
    el.textContent = `${p.spec.label} · ${p.object.userData.tris} tris`;
    el.style.left = `${(i % cols) * (100 / cols) + 1}%`;
    el.style.top = `${Math.floor(i / cols) * (100 / rows) + 1.5}%`;
    document.body.appendChild(el);
  });
}

const clock = new THREE.Clock();
let frames = 0;
const t0 = +(Q.get("t") || 0.02);
function frame() {
  setLights(Q.get("anim") === "1" ? clock.getElapsedTime() : t0);
  if (cam === "side") sideGrid();
  else renderer.render(scene, camera);
  if (++frames === 3) {
    const gl = renderer.getContext();
    gl.finish();
    const t = performance.now();
    for (let k = 0; k < 20; k++) {
      setLights(k * 0.05);
      renderer.render(scene, camera);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
    }
    const per = (performance.now() - t) / 20;
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    window.aircraftTest = { n: Q.get("n"), ready: true, tris, ms: per, calls: renderer.info.render.calls, sceneTris: renderer.info.render.triangles, gpu: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "?" };
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
