# The local relay: capture publishes rtmp://127.0.0.1:1935/airops, push reads it and forwards it, and the airops path
# is recorded in one-hour fMP4 segments. Loopback only; any other path (e.g. a test target) is accepted too.
logLevel: info
logDestinations: [stdout]
api: yes
apiAddress: 127.0.0.1:9997
rtsp: no
rtmp: yes
rtmpAddress: 127.0.0.1:1935
hls: no
webrtc: no
srt: no
moq: no
pathDefaults:
  record: no
  recordPath: /var/lib/airops-stream/rec/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1h
  recordDeleteAfter: 0s
paths:
  airops:
    record: yes
  all_others:
